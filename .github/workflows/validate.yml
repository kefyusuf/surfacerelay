name: validate

on:
  push:
  pull_request:

jobs:
  publication-metadata-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest scripts.tests.test_release_publication_preview -v
      - name: Build local candidates from exact archived sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then exit 1; fi
          mkdir -p "$RUNNER_TEMP/t903-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/t903-source"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from scripts.release_readiness import _rebuild_browser_distribution
          from scripts.browser_release_candidate import build_browser_release_candidate
          from scripts.laravel_release_candidate import build_laravel_release_candidate
          root = Path(os.environ['RUNNER_TEMP'])
          source = root / 't903-source'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          _rebuild_browser_distribution(source)
          for kind, builder in (('laravel', build_laravel_release_candidate), ('browser-runtime', build_browser_release_candidate)):
              builder(repo=source, stage_root=root / 't903-candidates' / kind,
                      artifact_version='0.1.0-alpha.1', source_revision=revision)
          PY
      - name: Review proposed metadata using local dry-run only
        shell: bash
        run: |
          python scripts/release_publication_preview.py \
            --candidate-root "$RUNNER_TEMP/t903-candidates" \
            --preview-root "$RUNNER_TEMP/t903-preview" \
            --version 0.1.0-alpha.1 --source-revision "$(git rev-parse HEAD)"
          python scripts/check_release_guardrails.py
      - uses: actions/upload-artifact@v4
        with:
          name: publication-metadata-preview-evidence
          path: |
            ${{ runner.temp }}/t903-preview/preview-evidence.json
            ${{ runner.temp }}/t903-preview/dry-run-evidence.json

  installed-alpha-application:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify cleanup after an HTTP server exits
        run: python -m unittest scripts.tests.test_alpha_application_cleanup -v
      - name: Build an exact-source local alpha archive
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          mkdir -p "$RUNNER_TEMP/t902-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/t902-source"
          PYTHONPATH="$RUNNER_TEMP/t902-source" python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from scripts.laravel_release_candidate import build_laravel_release_candidate
          build_laravel_release_candidate(
              repo=Path(os.environ['RUNNER_TEMP']) / 't902-source',
              stage_root=Path(os.environ['RUNNER_TEMP']) / 't902-artifact',
              artifact_version='0.1.0-alpha.1',
              source_revision=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
      - name: Exercise installed application authorization and shared-store concurrency
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/t902-artifact/surfacerelay-laravel-0.1.0-alpha.1.zip"
          python scripts/laravel_alpha_acceptance.py \
            --artifact "$artifact" --sha256 "$(sha256sum "$artifact" | cut -d ' ' -f 1)" \
            --source-revision "$(git rev-parse HEAD)" \
            --consumer "$RUNNER_TEMP/t902-consumer" --evidence "$RUNNER_TEMP/t902-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-alpha-application-evidence
          path: ${{ runner.temp }}/t902-evidence/application-acceptance.json
          if-no-files-found: warn

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py

  release-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release-contract dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run release-candidate contract tests
        run: python -m unittest discover -s scripts/tests -p 'test_release_candidate*.py' -v
      - name: Run integrated release-readiness tests
        run: python -m unittest scripts.tests.test_release_readiness -v
      - name: Check release publication guardrails
        run: python scripts/check_release_guardrails.py


  browser-release-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      T803_ARTIFACT_VERSION: 0.0.0-alpha1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify browser release-consumer checkout is exact and clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "browser release-consumer checkout must be clean before verification tools run" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/browser-runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser release-consumer Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run browser release-candidate tooling tests
        run: python -m unittest scripts.tests.test_browser_release_candidate -v
      - name: Build exact-revision artifact and execute clean consumer proof
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REVISION="$(git rev-parse HEAD)"
          SOURCE_ROOT="$RUNNER_TEMP/surfacerelay-t803-source"
          STAGE_ROOT="$RUNNER_TEMP/surfacerelay-t803-stage"
          CONSUMER_ROOT="$RUNNER_TEMP/surfacerelay-t803-consumer"

          mkdir -p "$SOURCE_ROOT"
          git archive HEAD | tar -x -C "$SOURCE_ROOT"

          npm --prefix "$SOURCE_ROOT/packages/browser-runtime" ci
          npm --prefix "$SOURCE_ROOT/packages/browser-runtime" run build

          python - "$SOURCE_ROOT" "$STAGE_ROOT" "$CONSUMER_ROOT" "$SOURCE_REVISION" "$T803_ARTIFACT_VERSION" <<'PY'
          from pathlib import Path
          import sys

          source_root = Path(sys.argv[1])
          stage_root = Path(sys.argv[2])
          consumer_root = Path(sys.argv[3])
          revision = sys.argv[4]
          version = sys.argv[5]

          sys.path.insert(0, str(source_root))
          from scripts import browser_release_candidate as release

          candidate = release.build_browser_release_candidate(
              repo=source_root,
              stage_root=stage_root,
              artifact_version=version,
              source_revision=revision,
          )
          release.validate_browser_artifact_archive(
              archive_path=candidate["archivePath"],
              artifact_version=version,
          )
          release.create_clean_consumer_workspace(
              consumer_root=consumer_root,
              fixture_root=source_root / "scripts" / "fixtures" / "browser-clean-consumer",
              package_source_root=source_root / "packages" / "browser-runtime",
          )
          proof = release.execute_clean_consumer_proof(
              consumer_root=consumer_root,
              archive_path=candidate["archivePath"],
              artifact_version=version,
              package_source_root=source_root / "packages" / "browser-runtime",
          )

          expected_smoke = "SurfaceRelay browser-runtime clean-consumer smoke: PASS"
          if proof["smokeOutput"] != expected_smoke:
              raise SystemExit("unexpected browser clean-consumer smoke output")
          if not all(
              (
                  proof["rootImport"],
                  proof["typecheck"],
                  proof["bundle"],
                  proof["deepImportRejected"],
              )
          ):
              raise SystemExit("browser clean-consumer proof is incomplete")

          print(expected_smoke)
          print("SurfaceRelay browser-runtime deep-import rejection: PASS")
          PY

  laravel-release-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            laravel-version: '^12.0'
          - php-version: '8.3'
            laravel-version: '^13.0'
          - php-version: '8.4'
            laravel-version: '^12.0'
          - php-version: '8.4'
            laravel-version: '^13.0'
    name: laravel-release-consumer (PHP ${{ matrix.php-version }}, Laravel ${{ matrix.laravel-version }})
    env:
      T802_ARTIFACT_VERSION: 0.0.0-alpha1
      T802_LARAVEL_VERSION: ${{ matrix.laravel-version }}
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_NO_AUDIT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release-consumer checkout is exact and clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "release-consumer checkout must be clean before verification tools run" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring
      - name: Install release-consumer Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Laravel release-candidate tooling tests
        run: python -m unittest scripts.tests.test_laravel_release_candidate -v
      - name: Build exact-revision artifact and clean consumer workspace
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_REVISION="$(git rev-parse HEAD)"

          SOURCE_ROOT="$RUNNER_TEMP/surfacerelay-t802-source"
          STAGE_ROOT="$RUNNER_TEMP/surfacerelay-t802-stage"
          CONSUMER_ROOT="$RUNNER_TEMP/surfacerelay-t802-consumer"

          mkdir -p "$SOURCE_ROOT"
          git archive HEAD | tar -x -C "$SOURCE_ROOT"

          python - "$SOURCE_ROOT" "$STAGE_ROOT" "$CONSUMER_ROOT" "$SOURCE_REVISION" "$T802_ARTIFACT_VERSION" "$T802_LARAVEL_VERSION" <<'PY'
          from pathlib import Path
          import sys

          source_root = Path(sys.argv[1])
          stage_root = Path(sys.argv[2])
          consumer_root = Path(sys.argv[3])
          revision = sys.argv[4]
          version = sys.argv[5]
          laravel_constraint = sys.argv[6]

          sys.path.insert(0, str(source_root))
          from scripts import laravel_release_candidate as release

          candidate = release.build_laravel_release_candidate(
              repo=source_root,
              stage_root=stage_root,
              artifact_version=version,
              source_revision=revision,
          )
          release.validate_laravel_artifact_archive(
              archive_path=candidate["archivePath"],
              artifact_version=version,
          )
          release.create_clean_consumer_workspace(
              consumer_root=consumer_root,
              artifact_directory=Path(candidate["archivePath"]).parent,
              artifact_version=version,
              laravel_constraint=laravel_constraint,
              package_source_root=source_root / "packages" / "laravel",
          )
          PY

          {
            echo "T802_SOURCE_REVISION=$SOURCE_REVISION"
            echo "T802_SOURCE_ROOT=$SOURCE_ROOT"
            echo "T802_STAGE_ROOT=$STAGE_ROOT"
            echo "T802_CONSUMER_ROOT=$CONSUMER_ROOT"
          } >> "$GITHUB_ENV"
      - name: Install clean consumer from Composer artifact repository
        run: >-
          composer update
          --working-dir="$T802_CONSUMER_ROOT"
          --no-interaction
          --no-progress
          --prefer-dist
          --no-scripts
      - name: Verify exact installed candidate and autoload
        shell: bash
        run: |
          set -euo pipefail

          python - "$T802_CONSUMER_ROOT" "$T802_ARTIFACT_VERSION" "$T802_SOURCE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          consumer_root = Path(sys.argv[1])
          version = sys.argv[2]
          source_root = Path(sys.argv[3])

          sys.path.insert(0, str(source_root))
          from scripts import laravel_release_candidate as release

          release.verify_clean_consumer_install(
              consumer_root=consumer_root,
              artifact_version=version,
              package_source_root=source_root / "packages" / "laravel",
          )
          PY

          php -r '
          require getenv("T802_CONSUMER_ROOT") . "/vendor/autoload.php";
          if (!class_exists(\SurfaceRelay\Laravel\SurfaceRelayServiceProvider::class)) {
              fwrite(STDERR, "SurfaceRelayServiceProvider did not autoload\n");
              exit(1);
          }
          '
      - name: Run latest-supported ActionBus clean-consumer smoke
        if: matrix.php-version == '8.4' && matrix.laravel-version == '^13.0'
        shell: bash
        run: |
          set -euo pipefail

          cp scripts/fixtures/laravel-clean-consumer/smoke.php "$T802_CONSUMER_ROOT/smoke.php"
          OUTPUT="$(php "$T802_CONSUMER_ROOT/smoke.php" "$T802_CONSUMER_ROOT")"
          if [ "$OUTPUT" != "SurfaceRelay Laravel clean-consumer smoke: PASS" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          printf '%s\n' "$OUTPUT"

  php-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: surfacerelay_test
          MYSQL_ROOT_PASSWORD: surfacerelay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -psurfacerelay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SURFACERELAY_TEST_MYSQL_HOST: 127.0.0.1
      SURFACERELAY_TEST_MYSQL_PORT: 3306
      SURFACERELAY_TEST_MYSQL_DATABASE: surfacerelay_test
      SURFACERELAY_TEST_MYSQL_USERNAME: root
      SURFACERELAY_TEST_MYSQL_PASSWORD: surfacerelay
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            illuminate-version: '^12.0'
            testbench-version: '^10.0'
          - php-version: '8.3'
            illuminate-version: '^13.0'
            testbench-version: '^11.0'
          - php-version: '8.4'
            illuminate-version: '^12.0'
            testbench-version: '^10.0'
          - php-version: '8.4'
            illuminate-version: '^13.0'
            testbench-version: '^11.0'
    name: php-tests (PHP ${{ matrix.php-version }}, Illuminate ${{ matrix.illuminate-version }}, Testbench ${{ matrix.testbench-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: pdo_mysql, intl
      - name: Constrain Illuminate to the matrix version
        working-directory: packages/laravel
        run: >-
          composer require --no-interaction --no-progress --no-update
          "illuminate/contracts:${{ matrix.illuminate-version }}"
          "illuminate/support:${{ matrix.illuminate-version }}"
          "illuminate/validation:${{ matrix.illuminate-version }}"
      - name: Constrain Testbench, Livewire and Filament integration dependencies
        working-directory: packages/laravel
        run: >-
          composer require --dev --no-interaction --no-progress --no-update
          "orchestra/testbench:${{ matrix.testbench-version }}"
          "livewire/livewire:^4.4"
          "filament/filament:^5.0"
      - name: Install dependencies
        working-directory: packages/laravel
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        working-directory: packages/laravel
        run: composer validate --strict
      - name: Run PHP test suite
        working-directory: packages/laravel
        run: composer test

  laravel-mcp-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'
            laravel-version: '^12.41.1'
            testbench-version: '^10.8'
          - php-version: '8.3'
            laravel-version: '^13.0'
            testbench-version: '^11.0'
          - php-version: '8.4'
            laravel-version: '^12.41.1'
            testbench-version: '^10.8'
          - php-version: '8.4'
            laravel-version: '^13.0'
            testbench-version: '^11.0'
    name: laravel-mcp-tests (PHP ${{ matrix.php-version }}, Laravel ${{ matrix.laravel-version }}, Testbench ${{ matrix.testbench-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          extensions: mbstring
      - name: Constrain Laravel and Testbench to the matrix version
        working-directory: packages/laravel-mcp
        run: >-
          composer require --dev --no-interaction --no-progress --no-update
          "laravel/framework:${{ matrix.laravel-version }}"
          "orchestra/testbench:${{ matrix.testbench-version }}"
      - name: Install dependencies
        working-directory: packages/laravel-mcp
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        working-directory: packages/laravel-mcp
        run: composer validate --strict
      - name: Run Laravel MCP bridge test suite
        working-directory: packages/laravel-mcp
        run: composer test

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP sources
        run: find packages/laravel packages/laravel-mcp -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/browser-runtime/package-lock.json
      - name: Install browser-runtime dependencies
        working-directory: packages/browser-runtime
        run: npm ci
      - name: Typecheck browser runtime
        working-directory: packages/browser-runtime
        run: npm run typecheck
      - name: Run browser-runtime tests
        working-directory: packages/browser-runtime
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run conformance runner unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*conformance*.py' -v
      - name: Build browser conformance harnesses
        working-directory: packages/browser-runtime
        run: npm run conformance:build
      - name: Run canonical runtime conformance
        run: python scripts/run_conformance.py

  openapi-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/openapi-importer/package-lock.json
      - name: Install OpenAPI importer dependencies
        working-directory: packages/openapi-importer
        run: npm ci
      - name: Typecheck OpenAPI importer
        working-directory: packages/openapi-importer
        run: npm run typecheck
      - name: Run OpenAPI importer tests
        working-directory: packages/openapi-importer
        run: npm test
