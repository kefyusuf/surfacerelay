name: htmx-fixture

on:
  push:
    paths:
      - 'examples/htmx-prep-list/**'
      - 'examples/prep-list/action.add-item.json'
      - 'packages/browser-runtime/src/**'
      - 'packages/browser-runtime/tsconfig.json'
      - '.github/workflows/htmx-fixture.yml'
  pull_request:
    paths:
      - 'examples/htmx-prep-list/**'
      - 'examples/prep-list/action.add-item.json'
      - 'packages/browser-runtime/src/**'
      - 'packages/browser-runtime/tsconfig.json'
      - '.github/workflows/htmx-fixture.yml'
  schedule:
    # The proof installs fresh npm/Playwright resolutions on every run; a
    # monthly schedule surfaces upstream drift even when no tracked path
    # changes, mirroring the filament-live schedule (T-925).
    - cron: '0 7 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  htmx-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/htmx-prep-list/package-lock.json
      - name: Install fixture dependencies
        working-directory: examples/htmx-prep-list
        run: npm ci
      - name: Install Chromium
        working-directory: examples/htmx-prep-list
        run: npx playwright install --with-deps chromium
      - name: Run real HTMX fixture
        working-directory: examples/htmx-prep-list
        run: npm test
