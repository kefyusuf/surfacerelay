name: A2-01 independent alpha.3 consumer

# One-off acceptance gate; never run on push, PR or a schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-consumer:
    name: Published registry Laravel 13 + Filament 5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Checkout acceptance scripts only as reference
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP 8.4 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, xml, zip, openssl, intl, fileinfo
          coverage: none

      - name: Verify the standalone acceptance verifier
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/acceptance/a2-alpha3
          python3 -m unittest -v test_kit.py

      - name: Environment and registry preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/acceptance/a2-alpha3/preflight.py --output "$RUNNER_TEMP/a2-01-preflight.json"

      - name: Create clean registry-only consumer and verify installed bytes
        shell: bash
        run: |
          set -euo pipefail
          # This destination is newly created inside this run's ephemeral workspace.
          bash scripts/acceptance/a2-alpha3/run_a2_01.sh "$RUNNER_TEMP/a2-alpha3-consumer"

      - name: Upload bounded proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-01-alpha3-acceptance-json
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/a2-01-preflight.json
            ${{ runner.temp }}/a2-alpha3-consumer/a2-01-lock-verification.json
            ${{ runner.temp }}/a2-alpha3-consumer/a2-01-critical-payload-verification.json
